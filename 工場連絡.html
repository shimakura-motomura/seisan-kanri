<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f2f2">
<title>工場連絡システム</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;900&family=Noto+Sans+JP:wght@400;500;700;900&display=swap">
<style>
:root {
  --bg: #f3f2f2;
  --ink: #201e1d;
  --accent: #ec3013;
  --accent-press: #dd2b0f;
  --muted: #6e6a68;
  --muted-2: #4a4645;
  --panel: #eae9e9;
  --sep: #9c9896;
  --sep-2: #b8b4b2;
  --divider-25: rgba(32, 30, 29, 0.25);
  --divider-35: rgba(32, 30, 29, 0.35);
  --divider-20: rgba(32, 30, 29, 0.2);
  --backdrop: rgba(32, 30, 29, 0.55);
  --page-bg: #dedcda;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--page-bg); color: var(--ink); font-family: "Archivo", "Noto Sans JP", system-ui, sans-serif; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; border-radius: 0; background: none; padding: 0; -webkit-appearance: none; appearance: none; }
input, textarea { font: inherit; color: inherit; -webkit-appearance: none; appearance: none; }
input:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
::-webkit-scrollbar { width: 0; height: 0; }

.app { position: relative; width: 100%; max-width: 560px; min-height: 100dvh; min-height: 100vh; margin: 0 auto; background: var(--bg); display: flex; flex-direction: column; overflow: hidden; }

.header { flex: 0 0 auto; background: var(--bg); border-bottom: 2px solid var(--ink); }
.header-row { display: flex; align-items: flex-end; justify-content: space-between; padding: 14px 16px 10px; }
.header-eyebrow { font-size: 11px; letter-spacing: 0.14em; font-weight: 700; color: var(--muted); }
.header-title { font-size: 26px; font-weight: 900; line-height: 1; }
.header-count { display: flex; align-items: baseline; gap: 4px; }
.header-count-num { font-size: 22px; font-weight: 900; color: var(--accent); }
.header-count-unit { font-size: 12px; font-weight: 700; color: var(--muted); }

.search-row { display: flex; align-items: center; border-top: 1px solid var(--divider-25); }
.search-icon { flex: 0 0 auto; padding: 0 10px 0 16px; font-size: 15px; color: var(--muted); }
.search-input { flex: 1 1 auto; min-width: 0; height: 48px; border: 0; background: transparent; font-size: 15px; font-weight: 500; outline: none; color: var(--ink); }
.search-input::placeholder { color: var(--muted); opacity: 1; }
.search-clear { flex: 0 0 auto; height: 48px; width: 48px; border-left: 1px solid var(--divider-25); background: transparent; font-size: 13px; font-weight: 700; color: var(--muted); }

.sort-row { display: flex; border-top: 1px solid var(--divider-25); }
.sort-label { flex: 0 0 auto; display: flex; align-items: center; padding: 0 10px 0 16px; font-size: 10px; letter-spacing: 0.1em; font-weight: 700; color: var(--muted); }
.sort-btn { flex: 1 1 0; height: 40px; border-left: 1px solid var(--divider-25); font-size: 13px; font-weight: 700; text-align: left; padding-left: 12px; background: transparent; color: var(--ink); }
.sort-btn.is-active { background: var(--ink); color: var(--bg); }

.dept-row { display: flex; border-top: 1px solid var(--divider-25); overflow-x: auto; }
.dept-btn { flex: 0 0 auto; height: 40px; padding: 0 12px; border-left: 1px solid var(--divider-25); font-size: 13px; font-weight: 700; white-space: nowrap; display: flex; align-items: center; gap: 5px; background: transparent; color: var(--ink); }
.dept-btn.is-active { background: var(--ink); color: var(--bg); }
.dept-btn-n { font-size: 10px; font-weight: 700; opacity: 0.7; }

.main { flex: 1 1 auto; overflow-y: auto; }

.job-list { padding-bottom: 12px; }
.job-row { display: flex; align-items: stretch; border-bottom: 1px solid var(--divider-35); background: var(--bg); }
.job-main { flex: 1 1 auto; min-width: 0; text-align: left; padding: 7px 8px 7px 14px; display: flex; flex-direction: column; gap: 2px; text-decoration: none; }
.job-main:active { background: var(--panel); }
.job-head { display: flex; align-items: baseline; gap: 8px; width: 100%; }
.job-site {
  flex: 1 1 auto; min-width: 0; font-size: 17px; font-weight: 900; line-height: 1.15; color: var(--ink);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 2px; text-underline-offset: 2px;
}
.job-no { flex: 0 0 auto; font-size: 14px; font-weight: 900; color: var(--accent); letter-spacing: 0.02em; }
.job-line1 { font-size: 10px; font-weight: 700; color: var(--muted-2); line-height: 1.45; width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.job-line1 .sep { color: var(--sep); }
.job-line2 { font-size: 10px; font-weight: 500; color: var(--muted); line-height: 1.45; width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.job-line2 .sep { color: var(--sep-2); }
.job-progress { display: flex; gap: 3px; margin-top: 4px; }
.job-progress-seg { flex: 1 1 0; height: 4px; background: var(--divider-25); }
.job-progress-seg.is-done { background: var(--accent); }
.job-history { flex: 0 0 46px; border-left: 1px solid var(--divider-20); background: transparent; color: var(--muted-2); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; }
.job-history:active { background: var(--ink); color: var(--bg); }
.job-history-label { font-size: 10px; font-weight: 700; }
.job-history-count { font-size: 13px; font-weight: 900; }

.empty { padding: 40px 16px; }
.empty-title { font-size: 15px; font-weight: 700; }
.empty-sub { font-size: 13px; color: var(--muted); margin-top: 6px; }

.post-form { background: var(--panel); border-bottom: 2px solid var(--ink); padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 10px; }
.post-form-title { font-size: 11px; letter-spacing: 0.12em; font-weight: 700; color: var(--muted); }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: 12px; font-weight: 700; }
.field-input { height: 52px; border: 2px solid var(--ink); background: var(--bg); padding: 0 12px; font-size: 16px; font-weight: 700; color: var(--ink); }
.field-textarea { border: 2px solid var(--ink); background: var(--bg); padding: 10px 12px; font-size: 16px; line-height: 1.5; resize: none; color: var(--ink); }
.post-submit { height: 60px; border: 2px solid var(--accent); background: var(--accent); color: #fff; font-size: 18px; font-weight: 900; text-align: left; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; width: 100%; }
.post-submit:active { background: var(--accent-press); border-color: var(--accent-press); }
.post-submit-hint { font-size: 13px; font-weight: 500; }

.post { background: var(--bg); border-bottom: 2px solid var(--ink); padding: 12px 16px 14px; display: flex; flex-direction: column; gap: 6px; }
.post-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.post-name-tag { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.post-name { font-size: 17px; font-weight: 900; }
.post-when { flex: 0 0 auto; font-size: 12px; font-weight: 700; color: var(--muted); }
.post-body { font-size: 15px; line-height: 1.55; white-space: pre-wrap; }

.tabbar { flex: 0 0 auto; display: flex; border-top: 2px solid var(--ink); background: var(--bg); }
.tab-btn { flex: 1 1 0; height: 62px; background: transparent; color: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; }
.tab-btn.is-active { background: var(--ink); color: var(--bg); }
.tab-btn + .tab-btn { border-left: 2px solid var(--ink); }
.tab-btn-main { font-size: 17px; font-weight: 900; }
.tab-btn-sub { font-size: 10px; letter-spacing: 0.08em; font-weight: 700; opacity: 0.75; }

.sheet-backdrop { position: absolute; inset: 0; background: var(--backdrop); display: flex; flex-direction: column; justify-content: flex-end; }
.sheet-panel { background: var(--bg); border-top: 2px solid var(--ink); max-height: 76%; display: flex; flex-direction: column; }
.sheet-head { display: flex; align-items: flex-start; justify-content: space-between; padding: 14px 16px; border-bottom: 2px solid var(--ink); }
.sheet-eyebrow { font-size: 10px; letter-spacing: 0.12em; font-weight: 700; color: var(--muted); }
.sheet-title { font-size: 19px; font-weight: 900; line-height: 1.2; }
.sheet-sub { font-size: 12px; font-weight: 700; color: var(--muted); }
.sheet-close { height: 44px; width: 44px; border: 2px solid var(--ink); background: transparent; font-size: 15px; font-weight: 700; }
.sheet-list { overflow-y: auto; }
.rev-row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--divider-25); background: transparent; }
.rev-row.is-latest { background: var(--panel); }
.rev-badge { flex: 0 0 44px; height: 44px; border: 2px solid var(--muted); color: var(--muted); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 900; }
.rev-row.is-latest .rev-badge { border-color: var(--accent); color: var(--accent); }
.rev-mid { flex: 1 1 auto; min-width: 0; }
.rev-date { font-size: 15px; font-weight: 700; }
.rev-tag { font-size: 12px; font-weight: 700; color: var(--muted); }
.rev-note { font-size: 12px; color: var(--muted-2); }
.rev-open { flex: 0 0 auto; height: 44px; padding: 0 12px; border: 2px solid var(--ink); background: transparent; font-size: 13px; font-weight: 700; text-decoration: none; display: flex; align-items: center; }
.rev-open:active { background: var(--ink); color: var(--bg); }

.loading { padding: 40px 16px; font-size: 14px; color: var(--muted); }
</style>
</head>
<body>
<div id="app" class="app"></div>
<script>
"use strict";

// 島倉鉄工所 生産管理システムのGAS(Google Apps Script)エンドポイント
const GAS_URL = "https://script.google.com/macros/s/AKfycbxsFKa97XhdXtugAVSXMp0Vz64-fR-XrcmkF2U_W_A_Dl9PvCds6KfdtHhjXX7GxjYA6Q/exec";

const state = {
  tab: "製造",
  query: "",
  sort: "due",
  dept: "すべて",
  sheet: null,
  name: "",
  body: "",
  posts: [],
  jobs: [],
  loading: true,
  posting: false
};

const app = document.getElementById("app");

function escapeHtml(str) {
  return String(str ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function md(v) {
  if (!v) return "";
  const d = new Date(v);
  if (isNaN(d.getTime())) return String(v);
  return (d.getMonth() + 1) + "/" + d.getDate();
}

// 製作区分(スプレッドシートの「製」列)を、画面表示用の部署名に変換
function kubunToDept(seisaku, ku) {
  const v = String(seisaku || "");
  if ((ku || "").includes("コイル") || v.includes("コイル")) return "コイル";
  if (v === "1" || v === "第一") return "第1工場";
  if (v === "S") return "SUS工場";
  if (v.includes("杉")) return "杉原";
  return "他";
}
const DEPTS = ["第1工場", "SUS工場", "コイル", "杉原", "他"];

async function loadJobs() {
  const res = await fetch(GAS_URL + "?type=products");
  const rows = await res.json();
  const header = rows[0];
  const idx = name => header.indexOf(name);
  const iSeizou = idx("製造番号"), iGenba = idx("現場名"), iNouki = idx("納期"), iHinmei = idx("品名"),
    iSunpou = idx("寸法"), iKu = idx("区"), iSeisaku = idx("製"), iTosou = idx("塗装仕様"),
    iZumen = idx("図"), iToroku = idx("登録日"),
    iJuchu = idx("受注日"), iSeisakuDay = idx("製作日"), iKansei = idx("完成日"),
    iNaiso = idx("内装日"), iGaiso = idx("外装日"), iShukka = idx("出荷日");

  return rows.slice(1)
    .filter(r => r[iSeizou] && r[iGenba])
    .map(r => {
      const zumen = r[iZumen] || "";
      return {
        no: r[iSeizou],
        site: r[iGenba],
        due: r[iNouki] || "",
        dept: kubunToDept(r[iSeisaku], r[iKu]),
        item: r[iHinmei] || "",
        dims: r[iSunpou] || "",
        paint: r[iTosou] || "",
        zumen: zumen,
        // 進捗バー用:受注日→製作日→完成日→内装日→外装日→出荷日の6段階。日付が入っていれば完了扱い
        progress: [r[iJuchu], r[iSeisakuDay], r[iKansei], r[iNaiso], r[iGaiso], r[iShukka]].map(v => !!v),
        // 図面履歴機能は未実装のため、現状は「登録されている最新図面」のみを1件として表示する
        revs: zumen ? [{ rev: "Rev.1", date: r[iToroku] || "", note: "登録図面", url: zumen }] : []
      };
    });
}

async function loadPosts() {
  const res = await fetch(GAS_URL + "?type=messages");
  const rows = await res.json();
  const header = rows[0];
  const idxName = header.indexOf("投稿者") >= 0 ? header.indexOf("投稿者") : 0;
  const idxWhen = header.indexOf("日時") >= 0 ? header.indexOf("日時") : 1;
  const idxBody = header.indexOf("内容") >= 0 ? header.indexOf("内容") : 2;
  return rows.slice(1)
    .filter(r => r[idxName] || r[idxBody])
    .map(r => ({ name: r[idxName], body: r[idxBody], when: formatWhen(r[idxWhen]) }))
    .reverse(); // 新しい投稿を上に
}

function formatWhen(v) {
  if (!v) return "";
  const d = new Date(v);
  if (isNaN(d.getTime())) return String(v);
  return String(d.getMonth() + 1).padStart(2, "0") + "/" + String(d.getDate()).padStart(2, "0") +
    " " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
}

function visibleJobs() {
  const q = state.query.trim();
  let jobs = state.jobs
    .filter(j => state.dept === "すべて" || j.dept === state.dept)
    .filter(j => !q || j.no.includes(q) || j.site.includes(q));
  jobs = jobs.slice().sort((a, b) => {
    if (state.sort === "due") {
      const da = a.due ? new Date(a.due).getTime() : Infinity;
      const db = b.due ? new Date(b.due).getTime() : Infinity;
      return da - db;
    }
    return a.no.localeCompare(b.no);
  });
  return jobs;
}

function renderHeader() {
  const isJobs = state.tab === "製造";
  const count = isJobs ? visibleJobs().length : state.posts.length;
  const countUnit = isJobs ? "件" : "件の連絡";
  return `
    <div class="header">
      <div class="header-row">
        <div>
          <div class="header-eyebrow">工場連絡システム</div>
          <div class="header-title">${escapeHtml(state.tab)}</div>
        </div>
        <div class="header-count">
          <span class="header-count-num">${count}</span>
          <span class="header-count-unit">${countUnit}</span>
        </div>
      </div>
      ${isJobs ? renderJobsToolbar() : ""}
    </div>
  `;
}

function renderJobsToolbar() {
  const sorts = [
    { key: "due", label: "納期が近い順" },
    { key: "no", label: "製造番号順" }
  ];
  const deptOptions = ["すべて", ...DEPTS];
  return `
    <div class="search-row">
      <div class="search-icon">検索</div>
      <input class="search-input" data-action="query-input" placeholder="製造番号・現場名で検索" value="${escapeHtml(state.query)}">
      <button class="search-clear" data-action="query-clear">×</button>
    </div>
    <div class="sort-row">
      <div class="sort-label">並び</div>
      ${sorts.map(s => `<button class="sort-btn${state.sort === s.key ? " is-active" : ""}" data-action="sort" data-sort="${s.key}">${s.label}</button>`).join("")}
    </div>
    <div class="dept-row">
      ${deptOptions.map(d => {
        const n = d === "すべて" ? state.jobs.length : state.jobs.filter(j => j.dept === d).length;
        return `<button class="dept-btn${state.dept === d ? " is-active" : ""}" data-action="dept" data-dept="${escapeHtml(d)}"><span>${escapeHtml(d)}</span><span class="dept-btn-n">${n}</span></button>`;
      }).join("")}
    </div>
  `;
}

function renderJobsTab() {
  if (state.loading) return `<div class="loading">読み込み中...</div>`;
  const jobs = visibleJobs();
  if (jobs.length === 0) {
    return `<div class="job-list"><div class="empty"><div class="empty-title">該当する案件がありません</div><div class="empty-sub">検索条件を変えてください。</div></div></div>`;
  }
  return `
    <div class="job-list">
      ${jobs.map(j => `
        <div class="job-row">
          ${j.zumen
            ? `<a class="job-main" href="${escapeHtml(j.zumen)}" target="_blank" rel="noopener">${jobBody(j)}</a>`
            : `<div class="job-main">${jobBody(j)}</div>`}
          <button class="job-history" data-action="job-history" data-no="${escapeHtml(j.no)}">
            <span class="job-history-label">履歴</span>
            <span class="job-history-count">${j.revs.length}</span>
          </button>
        </div>
      `).join("")}
    </div>
  `;
}

function jobBody(j) {
  return `
    <div class="job-head">
      <span class="job-site">${escapeHtml(j.site)}</span>
      <span class="job-no">${escapeHtml(j.no)}</span>
    </div>
    <div class="job-line1">納期 ${md(j.due)}<span class="sep"> │ </span>${escapeHtml(j.item)}<span class="sep"> │ </span>${escapeHtml(j.dims)}</div>
    <div class="job-line2">${escapeHtml(j.paint || "塗装仕様 未入力")}</div>
    <div class="job-progress">
      ${(j.progress || []).map(done => `<div class="job-progress-seg${done ? " is-done" : ""}"></div>`).join("")}
    </div>
  `;
}

function renderBoardTab() {
  if (state.loading) return `<div class="loading">読み込み中...</div>`;
  const canPost = state.name.trim() && state.body.trim() && !state.posting;
  return `
    <div class="post-form">
      <div class="post-form-title">新しい連絡を書く</div>
      <div class="field">
        <label>お名前</label>
        <input class="field-input" data-action="name-input" placeholder="例:田中" value="${escapeHtml(state.name)}">
      </div>
      <div class="field">
        <label>連絡内容</label>
        <textarea class="field-textarea" data-action="body-input" rows="4" placeholder="例:25-1042 の内装、明日午前から着手します">${escapeHtml(state.body)}</textarea>
      </div>
      <button class="post-submit" data-action="post">
        <span>${state.posting ? "投稿中..." : "投稿する"}</span>
        <span class="post-submit-hint">${canPost || state.posting ? "" : "お名前と内容を入力"}</span>
      </button>
    </div>
    <div class="post-list">
      ${state.posts.map(p => `
        <div class="post">
          <div class="post-head">
            <div class="post-name-tag"><span class="post-name">${escapeHtml(p.name)}</span></div>
            <span class="post-when">${escapeHtml(p.when)}</span>
          </div>
          <div class="post-body">${escapeHtml(p.body)}</div>
        </div>
      `).join("")}
    </div>
  `;
}

function renderSheet() {
  if (!state.sheet) return "";
  const job = state.jobs.find(j => j.no === state.sheet);
  if (!job) return "";
  return `
    <div class="sheet-backdrop" data-action="sheet-close">
      <div class="sheet-panel" data-action="sheet-stop">
        <div class="sheet-head">
          <div>
            <div class="sheet-eyebrow">図面 変更履歴</div>
            <div class="sheet-title">${escapeHtml(job.site)}</div>
            <div class="sheet-sub">No. ${escapeHtml(job.no)}</div>
          </div>
          <button class="sheet-close" data-action="sheet-close">×</button>
        </div>
        <div class="sheet-list">
          ${job.revs.length === 0
            ? `<div class="empty"><div class="empty-title">図面が登録されていません</div></div>`
            : job.revs.map((r, i) => `
              <div class="rev-row${i === 0 ? " is-latest" : ""}">
                <div class="rev-badge">${escapeHtml(r.rev.replace("Rev.", "R"))}</div>
                <div class="rev-mid">
                  <div class="rev-date">${escapeHtml(md(r.date) || r.date)}${i === 0 ? '<span class="rev-tag">  最新</span>' : ""}</div>
                  <div class="rev-note">${escapeHtml(r.note)}</div>
                </div>
                <a class="rev-open" href="${escapeHtml(r.url)}" target="_blank" rel="noopener">開く</a>
              </div>
            `).join("")}
        </div>
      </div>
    </div>
  `;
}

function render() {
  const isJobs = state.tab === "製造";
  app.innerHTML = `
    ${renderHeader()}
    <div class="main">${isJobs ? renderJobsTab() : renderBoardTab()}</div>
    <div class="tabbar">
      <button class="tab-btn${isJobs ? " is-active" : ""}" data-action="tab" data-tab="製造">
        <span class="tab-btn-main">製造</span><span class="tab-btn-sub">案件一覧</span>
      </button>
      <button class="tab-btn${!isJobs ? " is-active" : ""}" data-action="tab" data-tab="連絡">
        <span class="tab-btn-main">連絡</span><span class="tab-btn-sub">伝言板</span>
      </button>
    </div>
    ${renderSheet()}
  `;
  const scrollEl = app.querySelector(".main");
  if (scrollEl) scrollEl.scrollTop = 0;
  focusPreservedInput();
}

let pendingFocus = null;
function focusPreservedInput() {
  if (!pendingFocus) return;
  const el = app.querySelector(`[data-action="${pendingFocus.action}"]`);
  if (el) {
    el.focus();
    const pos = pendingFocus.pos;
    if (pos != null && el.setSelectionRange) { try { el.setSelectionRange(pos, pos); } catch (e) {} }
  }
  pendingFocus = null;
}

app.addEventListener("input", e => {
  const action = e.target.dataset.action;
  if (action === "query-input") { state.query = e.target.value; pendingFocus = { action, pos: e.target.selectionStart }; render(); }
  else if (action === "name-input") { state.name = e.target.value; pendingFocus = { action, pos: e.target.selectionStart }; render(); }
  else if (action === "body-input") { state.body = e.target.value; pendingFocus = { action, pos: e.target.selectionStart }; render(); }
});

app.addEventListener("click", async e => {
  const target = e.target.closest("[data-action]");
  if (!target) return;
  const action = target.dataset.action;

  if (action === "query-clear") { state.query = ""; render(); }
  else if (action === "sort") { state.sort = target.dataset.sort; render(); }
  else if (action === "dept") { state.dept = target.dataset.dept; render(); }
  else if (action === "tab") { state.tab = target.dataset.tab; render(); }
  else if (action === "job-history") { state.sheet = target.dataset.no; render(); }
  else if (action === "sheet-close") { state.sheet = null; render(); }
  else if (action === "sheet-stop") { e.stopPropagation(); }
  else if (action === "post") {
    e.preventDefault();
    const name = state.name.trim();
    const body = state.body.trim();
    if (!name || !body || state.posting) return;
    state.posting = true;
    render();
    try {
      await fetch(GAS_URL, {
        method: "POST",
        body: JSON.stringify({ type: "message", toukousha: name, naiyou: body })
      });
      const when = formatWhen(new Date());
      state.posts = [{ name, body, when }, ...state.posts];
      state.body = "";
    } catch (err) {
      alert("投稿に失敗しました。通信環境を確認してもう一度お試しください。");
    } finally {
      state.posting = false;
      render();
    }
  }
});

(async function init() {
  render();
  try {
    const [jobs, posts] = await Promise.all([loadJobs(), loadPosts()]);
    state.jobs = jobs;
    state.posts = posts;
  } catch (err) {
    app.innerHTML = `<div class="loading">読み込みに失敗しました: ${escapeHtml(err.message)}</div>`;
    return;
  }
  state.loading = false;
  render();
})();
</script>
</body>
</html>
